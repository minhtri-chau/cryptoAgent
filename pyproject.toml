[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoagent"
version = "1.1.0"
description = "Crypto Intelligence Agent: data, quant and storage layers"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.5", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "TA-Lib>=0.6"]  # TA-Lib is a test-only reference for indicators

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptoagent = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
